# HemaNet local development stack (blueprint §T.2).
#
# Works with Docker Compose v2 (`docker compose up`) and podman-compose.
# Requires a `.env` file:  cp .env.example .env
# All ports are bound to 127.0.0.1 only.

name: hemanet

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
  WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
  READINESS_HEARTBEAT_MAX_AGE_SECONDS: ${READINESS_HEARTBEAT_MAX_AGE_SECONDS:-120}

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot release task: applies migrations before api/worker start (blueprint §T.3).
  migrate:
    build: ./backend
    image: localhost/hemanet-backend:dev
    command: ["flask", "db", "upgrade"]
    environment: *backend-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    image: localhost/hemanet-backend:dev
    # Local only: reload on code changes (never Flask debug mode, which exposes a debugger).
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--reload", "wsgi:app"]
    environment: *backend-env
    volumes:
      - ./backend/app:/app/app:ro,z
      - ./backend/migrations:/app/migrations:ro,z
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: localhost/hemanet-backend:dev
    command: ["python", "worker.py"]
    environment: *backend-env
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    image: localhost/hemanet-frontend:dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:
