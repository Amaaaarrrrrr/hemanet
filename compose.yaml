# HemaNet local development stack (blueprint §T.2).
#
# Works with Docker Compose v2 (`docker compose up`) and podman-compose.
# Requires a `.env` file:  cp .env.example .env
# All ports are bound to 127.0.0.1 only.

name: hemanet

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: localhost/hemanet-backend:dev
    environment:
      APP_ENV: ${APP_ENV:-local}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: localhost/hemanet-backend:dev
    command: ["python", "worker.py"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: localhost/hemanet-frontend:dev
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres-data:
