name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Bandit
        run: uv run bandit -q -c pyproject.toml -r .
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --frozen --no-dev -q > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier check
        run: npm run format:check
      - name: TypeScript (strict)
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: npm audit
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose

  stack:
    name: Container stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file from template
        run: cp .env.example .env
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke checks
        run: |
          curl -fsS http://127.0.0.1:8000/ | grep -q '"phase":"E0"'
          curl -fsS http://127.0.0.1:5173/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8025/ > /dev/null
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
